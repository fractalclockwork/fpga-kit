id: xc2xl
title: XC2-XL
kind: cpld
fpga: xc2c256-7-tq144
top: heartbeat_top
ucf: hdl/xc2xl/heartbeat.ucf
baud: 115200
clock_hz: 1843200
uart_name: xc2xl
jtag_index: 0
jtag_header: J1
sources:
  - hdl/xc2xl/heartbeat_top.v
devices:
  - id: ic2
    part: XC2C256
    family: CoolRunner-II
    package: TQ144
    clock_pin: "38"
    button_pin: "143"
    led_pin: "92"
    led: LD2
  - id: ic1
    part: XC9572XL
    family: XC9500XL
    package: VQ44
    clock_pin: "1"
    button_pin: "33"
    led_pin: "44"
    led: LD3
image_paths:
  - id: jtag-jedec
    primary: true
    volatile: false
    note: JEDEC program through the 6-pin header J1. The pattern remains after power is removed.
  - id: jtag-smt2
    primary: false
    volatile: false
    adept_device: JtagSmt2
    note: JTAG-SMT2 can reach the XC2C256. The 2021 manual says this module cannot target an XC9500XL, so jumper the XC9572XL out of the chain first.
