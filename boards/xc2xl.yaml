id: xc2xl
title: XC2-XL
kind: cpld
fpga: xc2c256-7-tq144
top: heartbeat_top
ucf: hdl/xc2xl/heartbeat.ucf
baud: 115200
clock_hz: 1843200
uart_name: xc2xl
jtag_index: 0
jtag_header: J1
sources:
  - hdl/xc2xl/heartbeat_top.v
  # Compact UART top is self-contained; common/heartbeat does not fit XC2C256.
devices:
  - id: ic2
    part: XC2C256
    family: CoolRunner-II
    package: TQ144
    clock_pin: "38"
    button_pin: "143"
    led_pin: "92"
    led: LD2
  - id: ic1
    part: XC9572XL
    family: XC9500XL
    package: VQ44
    clock_pin: "1"
    button_pin: "33"
    led_pin: "44"
    led: LD3
image_paths:
  - id: bus-blaster
    primary: true
    volatile: false
    note: Bus Blaster v4.1a on J1 with xc3sprog -c bbv2. CoolRunner at -p 0, XC9572XL at -p 1. Preferred path for both CPLDs.
  - id: jtag-smt2
    primary: false
    volatile: false
    adept_device: JtagSmt2
    note: Adept alternate for the XC2C256 only. Cannot target XC9500XL. Not used on this board going forward.
