id: nexys3
title: Nexys 3
fpga: xc6slx16-3csg324
idcode: "04002093"
device_name: XC6SLX16
adept_device: Nexys3
accept_any_adept_name: false
jtag_index: 0
baud: 115200
clock_hz: 100000000
uart_name: nexys3
top: heartbeat_top
ucf: hdl/nexys3/heartbeat.ucf
sources:
  - hdl/common/uart_rx.v
  - hdl/common/uart_tx.v
  - hdl/common/heartbeat.v
  - hdl/nexys3/heartbeat_top.v
control_buses:
  - id: adept-usb
    role: program
    tool: djtgcfg
    device: Nexys3
  - id: ftdi-uart
    role: runtime
    tool: pyserial
    baud: 115200
image_paths:
  - id: jtag
    primary: true
    volatile: true
    tool: djtgcfg
    note: djtgcfg prog -d Nexys3 -i 0 into FPGA SRAM
    adept_device: Nexys3
  - id: jtag-smt2
    primary: false
    volatile: true
    tool: djtgcfg
    adept_device: JtagSmt2
    note: Digilent JTAG-SMT2 wired to header J7. Select it with ADEPT_DEVICE=JtagSmt2.
  - id: bpi
    primary: false
    note: parallel PCM, mode jumper J8 set to BPI
  - id: spi
    primary: false
    note: quad SPI PCM, mode jumper J8 set to SPI
  - id: usb-stick
    primary: false
    note: one .bit in the root of a USB stick on the HID port, J8 in JTAG, then power cycle
phase_seeds_s:
  xst: 20
  ngdbuild: 15
  map: 30
  par: 60
  bitgen: 10
  program: 8
  serial: 5
